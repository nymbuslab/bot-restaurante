<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nymbus Pedidos">
  <!-- Marca da Nymbus Pedidos na aba do navegador: o mesmo glifo de garfo e faca do
       cabeçalho da landing, sobre o roxo da marca. O fundo sólido não é enfeite: o
       glifo é só traço e sumiria na barra de abas escura.
       Duas escolhas feitas olhando o ícone renderizado a 16px, que é o tamanho real
       da aba: o glifo ocupa ~60% do quadrado (com a margem original sobrava roxo e
       faltava desenho), e o traço subiu para 2.2 no espaço de 24 porque o peso do
       cabeçalho vira quase nada nessa escala. -->
  <rect width="32" height="32" rx="7" fill="#6344BC"/>
  <g transform="translate(3.4 3.4) scale(1.05)" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
    <path d="M7 2v20"/>
    <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h1"/>
    <path d="M21 15v7"/>
  </g>
</svg>
