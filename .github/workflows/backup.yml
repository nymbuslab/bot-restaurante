name: backup

on:
  schedule:
    - cron: "0 7 * * *" # 04:00 (BRT) todo dia
  workflow_dispatch: {}

# `issues: write` é só para o aviso de quebra abaixo: quando o backup diário
# falha, o job abre uma issue e a fecha sozinho quando volta a passar. Sem
# isso a falha só aparece pra quem abrir a aba Actions do GitHub, e só seria
# percebida no dia em que alguém precisasse restaurar de verdade.
permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: Instala pg_dump 17 (mesma major do Postgres do Supabase)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # --retry: a origem (postgresql.org) já travou a conexão em 0 bytes e
          # caiu com SSL EOF em instabilidades pontuais (15 e 16/11) — tenta de
          # novo em vez de falhar o backup do dia por uma rajada transitória.
          curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            --retry 3 --retry-all-errors --retry-delay 5 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # Baixar a chave por HTTPS não basta: confere a fingerprint oficial
          # antes de deixar o apt confiar nela pra instalar pacote nenhum.
          FPR=$(gpg --show-keys --with-colons --with-fingerprint \
            /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '/^fpr:/ {print $10; exit}')
          if [ "$FPR" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]; then
            echo "Fingerprint da chave do PGDG não confere: $FPR" >&2
            exit 1
          fi
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # O /usr/bin/pg_dump "genérico" do Ubuntu resolveu pra 16 mesmo com o
          # 17 instalado (a distro já vem com o client 16 de fábrica). Forçar o
          # binário certo primeiro no PATH em vez de depender do wrapper.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Instala age
        run: |
          curl -sSL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz
          sudo mv age/age /usr/local/bin/age
      - name: Roda o backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/backup.js

      # ---- Aviso de quebra ----
      # Uma issue só, reaproveitada: quebra em sequência vira comentário na mesma,
      # em vez de encher o repositório. O rótulo é o que liga uma coisa à outra.
      - name: Abre issue quando o backup falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create backup-vermelho --color B60205 --description "O backup diario esta falhando" 2>/dev/null || true
          CORPO=$(cat <<FIM
          O backup diário falhou.

          - Execução: $RUN_URL

          Esta issue fecha sozinha quando o backup voltar a passar.
          FIM
          )
          ABERTA=$(gh issue list --state open --label backup-vermelho --json number --jq '.[0].number')
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body "$CORPO"
          else
            gh issue create --title "Backup diário falhando" --label backup-vermelho --body "$CORPO"
          fi

      - name: Fecha a issue quando o backup volta a passar
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --label backup-vermelho --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Backup voltou a passar em $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          done
